# Grype vulnerability scanning configuration
# See: https://github.com/anchore/grype#specifying-matches-to-ignore

ignore:
  # glob 10.4.5 in devDependencies - path traversal vulnerability
  # This is a development-only dependency (used by babel-plugin-istanbul for code coverage)
  # Not present in production builds (npm run build creates static assets only)
  # glob 10.5.0 has a breaking change that breaks test-exclude/babel-plugin-istanbul
  # Risk: None in production - development tool only
  - vulnerability: GHSA-5j98-mcp5-4vw2
    package:
      name: glob
      type: npm

  # webpack-dev-server vulnerabilities (already documented in SECURITY.md as accepted risk)
  # Development-only, requires specific attack scenario, low likelihood
  - vulnerability: GHSA-4v9v-hfq4-rm2v
    package:
      name: webpack-dev-server
      type: npm
  - vulnerability: GHSA-9jgg-88mc-972h
    package:
      name: webpack-dev-server
      type: npm

  # minimatch 10.2.x ReDoS vulnerabilities (GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74)
  # The frontend production image serves static files via nginx. No application node_modules exist.
  # Node.js + npm are only present for the health check script. minimatch 10.2.2, if detected,
  # is from the globally installed npm CLI (npm install -g npm@latest), not application code.
  # npm's minimatch is only used during package installation, which does not happen at runtime.
  - vulnerability: GHSA-7r86-cg39-jmmj
    package:
      name: minimatch
      type: npm
    reason: |
      Production image has no application node_modules. Any minimatch finding is from npm CLI
      internals (global install), not application code. No glob patterns processed at runtime.
  - vulnerability: GHSA-23c5-xmqv-rm74
    package:
      name: minimatch
      type: npm
    reason: |
      Production image has no application node_modules. Any minimatch finding is from npm CLI
      internals (global install), not application code. No glob patterns processed at runtime.
